<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyBusy Chats</title>
  <link rel="preconnect" href="https://chats.dev.easy-busy.cloud" />
  <link rel="stylesheet" href="./styles/app.css" />
  <script src="./config.js"></script>
</head>
<body>
  <main class="eb-plugin-page">
    <section class="eb-plugin-stage">
      <section id="widget-state" class="widget-state" aria-live="polite">
        <div class="widget-spinner" aria-hidden="true"></div>
        <p id="widget-state-text">Загрузка EasyBusy Chats…</p>
        <button id="widget-retry" class="widget-retry" type="button" hidden>Повторить</button>
      </section>
      <div id="chat_container_holder">
        <div id="chat_container" hidden></div>
      </div>
    </section>
  </main>
  <div id="crm-dialog" class="eb-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="crm-dialog-title">
    <section class="eb-dialog__panel" data-crm-dialog-panel>
      <header class="eb-dialog__header">
        <h2 id="crm-dialog-title" data-crm-dialog-title></h2>
        <button class="eb-dialog__close" type="button" data-crm-dialog-close aria-label="Close">×</button>
      </header>
      <div class="eb-dialog__body" data-crm-dialog-body></div>
      <footer class="eb-dialog__footer" data-crm-dialog-footer></footer>
    </section>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
